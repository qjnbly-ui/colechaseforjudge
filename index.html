<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="This website is no longer active. The domain is available for purchase." />
  <meta name="theme-color" content="#0b0c10" />
  <title>Domain Available</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f8f8fa;
      background:
        radial-gradient(circle at 50% 20%, rgba(116, 92, 255, 0.2), transparent 36rem),
        #0b0c10;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    main {
      width: min(100%, 720px);
      text-align: center;
    }

    .status {
      margin: 0 0 22px;
      color: #9d9faa;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -0.065em;
    }

    .domain {
      margin: 24px 0 0;
      color: #b9aaff;
      font-size: clamp(1rem, 3vw, 1.3rem);
      overflow-wrap: anywhere;
    }

    .message {
      margin: 12px auto 0;
      color: #a6a8b2;
      font-size: 1rem;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
    }

    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      padding: 0 21px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      color: #f8f8fa;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 160ms ease, border-color 160ms ease;
    }

    a:first-child {
      color: #0b0c10;
      background: #f8f8fa;
    }

    a:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .credit {
      margin: 56px 0 0;
      color: #686a73;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .actions,
      .actions a {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="status">This website is no longer active</p>
    <h1>Domain available.</h1>
    <p class="domain">ColeChaseForJudge.com</p>
    <p class="message">Interested in purchasing this domain?</p>

    <div class="actions">
      <a href="https://n3xra.com" target="_blank" rel="noopener">Inquire Now</a>
      <a href="https://n3xra.com" target="_blank" rel="noopener">Need a website? N3XRA ↗</a>
    </div>

    <p class="credit">Designed &amp; built by N3XRA</p>
  </main>
</body>
</html>
